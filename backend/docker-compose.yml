version: '3.8'

services:

  db:
    image: postgres:15-alpine
    container_name: crm_postgres
    restart: always
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm_app
    restart: always
    ports:
      - "8080:8080"
    # Compose reads .env to substitute into this file; it does not forward the
    # host environment into the container. env_file does, and it forwards only
    # what is actually set — listing each var with a `:-` fallback would hand
    # Spring empty strings, which are NOT absent, so the defaults in
    # application.yml would stop applying.
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides .env on purpose: inside the network the database is `db`.
      DB_URL: jdbc:postgresql://db:5432/crm_db
      FIREBASE_CREDENTIALS_PATH: /app/firebase-service-account.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db
    profiles:
      - dev

volumes:
  postgres_data: