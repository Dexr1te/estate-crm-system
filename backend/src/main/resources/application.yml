spring:
  application:
    name: real-estate-crm

  # DATABASE
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  #JPA 
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway manages schema, so we use validate to ensure it matches the entities
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # FLYWAY 
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # FILE UPLOAD
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

  # MAIL (SMTP) — used to email invite codes. Defaults target Gmail SMTP.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# SERVER 
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

# JWT 
jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 86400000     # 1 день (ms)
  refresh-token-expiration: 604800000   # 7 дней (ms)


# SWAGGER / OPENAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
  info:
    title: Real Estate CRM API
    description: REST API for Real Estate CRM System
    version: 1.0.0

#  LOGGING
logging:
  level:
    com.crm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # Where the invite email's button points. Defaults to the landing page this
  # backend serves; repoint it at the web app or a verified deep link later
  # without touching EmailService.
  invite-url: ${INVITE_URL:${APP_BASE_URL:http://localhost:8080}/api/invite}
  # Where a listing's public link points; a token is appended. Defaults to the
  # page this backend serves at /api/l/<token>, so it only needs setting when
  # the page sits behind another origin. Must be the public origin, never
  # localhost: it is what clients receive in a chat, and what the page's
  # preview tags (og:image) name.
  listing-url: ${LISTING_URL:${APP_BASE_URL:http://localhost:8080}/api/l}
  # Custom scheme the landing page offers as "Open in the app".
  invite-deep-link: ${INVITE_DEEP_LINK:estatecrm://accept-invite}
  mail:
    # Master switch: emails are only sent when true AND SMTP creds are set.
    enabled: ${MAIL_ENABLED:false}
    # Local development only: while mail is off, print sign-up codes to the log
    # so an account can still be confirmed. Never enable this on a real host.
    log-codes: ${MAIL_LOG_CODES:false}
    # Gmail rewrites From to the authenticated account, so default to it.
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@estatecrm.app}}
    # Reject invites to domains that publish no MX/A record. Turn off for
    # offline development, where every lookup fails.
    verify-domain: ${MAIL_VERIFY_DOMAIN:true}
    verify-domain-timeout-ms: ${MAIL_VERIFY_DOMAIN_TIMEOUT_MS:3000}
  # The account App Review signs in with. Off by default, and it must stay off
  # outside a submission window: it exists only so a reviewer can get past a
  # login screen that has no sign-up behind it. See DemoDataSeeder, and
  # docs/app-store-submission.md for how it is used.
  demo:
    enabled: ${DEMO_ENABLED:false}
    email: ${DEMO_EMAIL:reviewer@demo.estatecrm.app}
    # No default on purpose: the seeder refuses to create the account rather
    # than put a guessable password on a real deployment.
    password: ${DEMO_PASSWORD:}
    full-name: ${DEMO_FULL_NAME:App Review}
  # THE ADMINISTRATOR
  #
  # The account that reaches the admin console. It used to be seeded by a
  # migration with the password written in it, which published the password to
  # every deployment of this repository; V18 retires those, and the account is
  # created or repaired at boot from what is set here.
  #
  # With no password set, nothing is created and nothing is changed — and a
  # deployment with no working administrator says so in the log at every start.
  admin:
    # Defaults to primary-admin-email, so the account that cannot be deleted and
    # the account that gets a password here are the same one.
    email: ${ADMIN_EMAIL:${PRIMARY_ADMIN_EMAIL:admin@gmail.com}}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Admin}

  documents:
    # Which store holds the bytes of deal documents.
    #
    # `database` keeps them in document_blobs, alongside the rows that describe
    # them. That is what a host with an ephemeral filesystem needs — a
    # container platform rebuilds the disk on every deploy, and on a free plan
    # on every wake from sleep, taking the paperwork with it.
    #
    # `s3` puts them in any S3-compatible bucket — R2, Backblaze, MinIO, AWS —
    # and is what a deployment wants once attachments outgrow the database's
    # own size limit, or once they are photographs rather than contracts. It
    # needs the app.s3 block below.
    #
    # `filesystem` is the oldest store and still the right answer wherever a
    # real volume is mounted: set it together with DOCUMENTS_DIR below.
    storage: ${DOCUMENTS_STORAGE:database}
    # Where `filesystem` writes. Relative paths resolve against the working
    # directory; with Docker this should be a mounted volume, so a rebuild does
    # not take the paperwork with it. Ignored by the `database` store.
    dir: ${DOCUMENTS_DIR:uploads/documents}

  # Read only when app.documents.storage=s3, and then all of it is required —
  # the client refuses to start on empty credentials rather than failing at the
  # first upload.
  s3:
    bucket: ${S3_BUCKET:}
    # Empty for AWS itself, which is resolved from the region. Everything else
    # needs its own endpoint: https://<account>.r2.cloudflarestorage.com, and so on.
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:auto}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    # Bucket in the path rather than in the hostname. AWS serves both; most of
    # the alternatives serve only this one.
    path-style: ${S3_PATH_STYLE:true}
