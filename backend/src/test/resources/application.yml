spring:
  application:
    name: real-estate-crm

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        # Lets a test count the statements a request actually issues, which is
        # the only way to keep an N+1 from creeping back in unnoticed.
        generate_statistics: true

  flyway:
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  # No key here on purpose: JwtService decodes it as Base64, and a Base64 blob in the
  # repository looks exactly like a leaked one. TestJwtSecret supplies it at run time.
  access-token-expiration: 86400000
  refresh-token-expiration: 604800000

app:
  base-url: http://localhost:8080
  mail:
    enabled: false
    # Tests must not depend on DNS being reachable, or on a domain still
    # existing years from now.
    verify-domain: false