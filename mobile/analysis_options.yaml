include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Implicit downcasts from dynamic were all in the datasources, where Dio's
    # res.data went straight into fromJson; core/network/json.dart is the seam
    # that replaced them. strict-inference stays off on purpose — it only asks
    # for an explicit <dynamic> on every dio call, which buys nothing.
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_parenthesis
    - use_super_parameters
