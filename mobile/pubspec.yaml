name: real_estate_crm
description: Real Estate CRM Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  shimmer: ^3.0.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.5.4

# Covers the window between the OS launching the app and Flutter painting its
# first frame. Regenerate with `dart run flutter_native_splash:create`.
#
# The artwork's own field is pure white (sampled at every edge), so the native
# window is white too and there is no seam when Flutter takes over and renders
# the same image full-screen.
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/estatecrm-app-icon-light-foreground.png"
  # Android 12+ replaced custom splash layouts with an OS-drawn centred icon on
  # a single colour — a full-bleed composition is not possible there, so both
  # paths deliberately show the same mark rather than diverging.
  android_12:
    color: "#FFFFFF"
    image: "assets/images/estatecrm-app-icon-light-foreground.png"
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  # Full-bleed square 1024 render of estatecrm-app-icon-light.svg on opaque
  # white. The canvas is square: the OS applies its own corner mask.
  # The dark variant (estatecrm-app-icon*.png) is kept as brand art but is not
  # installed: switching icons at runtime needs iOS alternate icons, which are
  # broken on iOS 26 (see git history).
  image_path: "assets/images/estatecrm-app-icon-light-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android adaptive: background matches the art's white field, and the
  # foreground is drawn at full scale -- the generator wraps it in its own
  # <inset android:inset="16%"> safe zone, so pre-shrinking would double up.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/estatecrm-app-icon-light-foreground.png"
  adaptive_icon_monochrome: "assets/images/estatecrm-app-icon-light-monochrome.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Only the splash composition is bundled. The icon artwork beside it is
    # consumed at build time by flutter_launcher_icons / flutter_native_splash
    # and never loaded at runtime, so listing the whole folder would ship ~1 MB
    # of PNGs the app never reads.
    - assets/images/splash-white.png

  # Brand typeface. The design handoff specifies Sora, which ships latin +
  # latin-ext only — every Russian and Kazakh string would fall back to the
  # platform font. Commissioner is the closest low-contrast geometric sans
  # with complete Cyrillic (including the Kazakh Ә Ғ Қ Ң Ө Ұ Ү Һ І) plus ₽
  # and ₸.
  #
  # Static instances cut from the upstream variable `Commissioner[…wght].ttf`
  # (OFL, see assets/fonts/OFL.txt) so `fontWeight` maps to a real cut rather
  # than a synthetic bold, then subset to latin + latin-ext + cyrillic +
  # cyrillic-ext + punctuation/currency.
  #
  # The family name is referenced through `AppFonts.sans` — never hardcode it.
  fonts:
    - family: Commissioner
      fonts:
        - asset: assets/fonts/Commissioner-400.ttf
          weight: 400
        - asset: assets/fonts/Commissioner-500.ttf
          weight: 500
        - asset: assets/fonts/Commissioner-600.ttf
          weight: 600
        - asset: assets/fonts/Commissioner-700.ttf
          weight: 700
