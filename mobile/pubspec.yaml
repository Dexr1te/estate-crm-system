name: real_estate_crm
description: Real Estate CRM Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  go_router: ^13.2.0
  cupertino_icons: ^1.0.6
  intl: ^0.20.2
  shimmer: ^3.0.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.5.4

flutter_launcher_icons:
  android: true
  ios: true
  # Full-bleed square 1024 render of estatecrm-app-icon.svg; the OS applies its
  # own corner mask, so no rounded corners are baked in.
  image_path: "assets/images/estatecrm-app-icon-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android adaptive: the mark sits inside the centre 66% safe zone so it
  # survives circle/squircle/teardrop masks.
  adaptive_icon_background: "#0F1E3C"
  adaptive_icon_foreground: "assets/images/estatecrm-app-icon-foreground.png"
  adaptive_icon_monochrome: "assets/images/estatecrm-app-icon-monochrome.png"

flutter:
  uses-material-design: true
  generate: true
